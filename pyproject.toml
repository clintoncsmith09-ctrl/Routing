[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "routing-matrix"
version = "0.1.0"
description = "Routes tasks to capability tiers by complexity and cost."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # Tested against temporalio 1.32.0 (full suite green at that version).
    # No hard upper pin — but this SDK's call signatures are strict (e.g.
    # Client.start_workflow's positional-args handling), so re-verify call
    # sites carefully on any version bump, then re-run the whole suite.
    "temporalio>=1.32.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["routing_matrix*", "orchestrator*"]
